<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hikayat Bisu · Validator</title><style>body{font:16px system-ui;max-width:760px;margin:2rem auto;padding:1rem;background:var(--background);color:var(--text)}button{padding:12px;background:var(--button);color:var(--text);border:2px solid var(--gold);border-radius:8px}pre{white-space:pre-wrap}</style></head><body><h1>Hikayat Bisu · Validator</h1><button id="run">Semak kandungan</button><pre id="report" role="status"></pre><script type="module">
import {palette} from '../src/theme/palette.js';
for(const [name,value] of Object.entries({background:palette.camp.far,text:palette.buttonText,button:palette.button,gold:palette.gold}))document.documentElement.style.setProperty(`--${name}`,value);
const required=['id','tier','topic','stage','domain','acceptedAnswers','hint','syllabusRef','reviewStatus','notes'];
const files=['sentences.json','antonyms.json'];
async function validate(){const messages=[],ids=new Set();let count=0;for(const file of files){try{const response=await fetch(`../content/${file}`);if(!response.ok)throw Error(`HTTP ${response.status}`);const entries=await response.json();if(!Array.isArray(entries))throw Error('Expected an array');for(const [index,item] of entries.entries()){count++;const label=`${file}[${index}]`;for(const key of required)if(!(key in item))messages.push(`${label}: missing ${key}`);if(!item.id||ids.has(item.id))messages.push(`${label}: missing/duplicate id ${item.id}`);ids.add(item.id);if(!Array.isArray(item.acceptedAnswers)||!item.acceptedAnswers.length||item.acceptedAnswers.some(answer=>typeof answer!=='string'||!answer.trim()))messages.push(`${label}: missing valid acceptedAnswers`);if(!['draft','reviewed','approved'].includes(item.reviewStatus))messages.push(`${label}: invalid reviewStatus`);if(!['mudah','biasa','mahir'].includes(item.tier))messages.push(`${label}: invalid tier`)}}catch(error){messages.push(`${file}: ${error.message}`)}}document.getElementById('report').textContent=`${count} entries checked\n${messages.length?messages.join('\n'):'PASS · no schema, duplicate, answer or status errors'}`}
document.getElementById('run').addEventListener('click',validate);validate();</script></body></html>
